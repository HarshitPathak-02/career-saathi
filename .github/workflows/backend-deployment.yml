name: Backend Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deployment.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/career-saathi

            git pull origin main

            cd backend

            docker build -t careersaathi-backend .

            docker stop careersaathi-backend || true
            docker rm careersaathi-backend || true

            docker run -d \
              --name careersaathi-backend \
              --env-file .env \
              -p 5000:5000 \
              careersaathi-backend

            docker image prune -f
